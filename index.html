<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a1a">
<title>CASADREW · Proyecto 001</title>
<style>
  :root { --fondo:#f6f1ea; --tarjeta:#fffdf9; --texto:#1a1a1a; --suave:#7a6f63; --linea:#e4dbcf; --acento:#c8643b; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#141210; --tarjeta:#1e1b18; --texto:#f3ede6; --suave:#a89c8f; --linea:#34302b; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; padding:32px 16px; background:var(--fondo); color:var(--texto);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:clamp(2rem,8vw,3rem); letter-spacing:.04em; text-align:center; }
  h1 span { color:var(--acento); }
  .sub { text-align:center; color:var(--suave); margin-top:6px; }
  .tarjeta { background:var(--tarjeta); border:1px solid var(--linea); border-radius:14px; padding:16px; margin-top:24px; }
  h2 { font-size:1.05rem; margin-bottom:10px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--linea);
          background:var(--fondo); color:var(--texto); }
  button { font:inherit; padding:12px 16px; border:0; border-radius:10px; background:var(--acento); color:#fff; cursor:pointer; }
  button.leve { background:transparent; color:var(--suave); padding:4px 8px; }
  ul { list-style:none; padding:0; margin-top:12px; }
  li { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--linea); }
  li span { flex:1; overflow-wrap:anywhere; }
  .estado { color:var(--suave); font-size:.9rem; margin-top:10px; min-height:1.2em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>CASA<span>DREW</span></h1>
  <p class="sub">Proyecto 001 — en construcción</p>

  <section class="tarjeta" id="acceso" hidden>
    <h2>Clave de acceso</h2>
    <form id="formClave"><input id="clave" type="password" placeholder="Escribe tu clave" autocomplete="current-password"><button>Entrar</button></form>
    <p class="estado" id="estadoClave"></p>
  </section>

  <section class="tarjeta" id="notas" hidden>
    <h2>Notas de prueba <button class="leve" id="salir" title="Olvidar la clave en este aparato">salir</button></h2>
    <form id="formNota"><input id="texto" placeholder="Escribe una nota" maxlength="500"><button>Guardar</button></form>
    <ul id="lista"></ul>
    <p class="estado" id="estado"></p>
  </section>
</main>
<script src="datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const HOJA = 'Notas';

function mostrar(conClave) { $('acceso').hidden = conClave; $('notas').hidden = !conClave; }

async function cargar() {
  $('estado').textContent = 'Cargando…';
  try {
    const filas = await Datos.listar(HOJA);
    $('lista').replaceChildren(...filas.reverse().map(f => {
      const li = document.createElement('li');
      const s = document.createElement('span'); s.textContent = f.texto;
      const b = document.createElement('button'); b.className = 'leve'; b.textContent = '✕'; b.title = 'Borrar';
      b.onclick = async () => { b.disabled = true; await Datos.borrar(HOJA, f.id).catch(e => alert(e.message)); cargar(); };
      li.append(s, b); return li;
    }));
    $('estado').textContent = filas.length ? '' : 'Aún no hay notas.';
  } catch (e) {
    $('estado').textContent = e.message;
    if (e.message === 'Clave incorrecta') { Datos.olvidarClave(); mostrar(false); }
  }
}

$('formClave').onsubmit = async ev => {
  ev.preventDefault();
  Datos.guardarClave($('clave').value);
  $('estadoClave').textContent = 'Comprobando…';
  try { await Datos.ping(); $('estadoClave').textContent = ''; mostrar(true); cargar(); }
  catch (e) { Datos.olvidarClave(); $('estadoClave').textContent = e.message; }
};
$('formNota').onsubmit = async ev => {
  ev.preventDefault();
  const texto = $('texto').value.trim(); if (!texto) return;
  $('estado').textContent = 'Guardando…';
  try { await Datos.agregar(HOJA, { texto }); $('texto').value = ''; cargar(); }
  catch (e) { $('estado').textContent = e.message; }
};
$('salir').onclick = () => { Datos.olvidarClave(); mostrar(false); };

if (Datos.clave()) { mostrar(true); cargar(); } else mostrar(false);
</script>
</body>
</html>
